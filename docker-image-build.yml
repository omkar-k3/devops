name: 1.0.$(Rev:.r)  # Automatically incrementing build number for each run


trigger:
  - azure-pipelines  # Triggers the pipeline on commits to the azure-pipelines branch

pool:
  vmImage: 'ubuntu-latest'  # Hosted agent that comes with Docker pre-installed

variables:
  # 1. Provide the exact name of the service connection you created in Step 1
  dockerRegistryServiceConnection: 'acr-service-connection-indiasouthcentral' 
  
  # 2. Name of your repository inside your container registry
  imageRepository: 'my-web-app' 
  
  # 3. Path to your Dockerfile relative to the repository root
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile' 
  
  # 4. Use the unique Build ID as the image tag for version traceability
  tag: '$(Build.BuildNumber)' 

  # --- Added for AKS deployment ---
  # Your registry's login server, e.g. myacr.azurecr.io
  acrLoginServer: 'myacrindiasouthcentral.azurecr.io'
  # Azure Resource Manager service connection that can access the AKS cluster(s)
  azureServiceConnection: 'my-resource-manager-connection'

stages:
- stage: BuildAndPushStage
  displayName: 'Build and Push Docker Image'
  jobs:
  - job: BuildAndPushJob
    displayName: 'Build and Push'
    steps:
    
    # The Docker@2 task handles both building and pushing in one unified command
    - task: Docker@2
      displayName: 'Build and Push Image to Registry'
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: '$(dockerfilePath)'
        tags: |
          $(tag)
          latest

# ---------- Region 1 ----------
- template: templates/deploy-region.yml
  parameters:
    region: indiasouthcentral
    environment: aks-indiasouthcentral
    resourceGroup: 'my-resource-group-India-west'
    clusterName: 'my-cluster-1'
    dependsOn:
      - BuildAndPushStage

