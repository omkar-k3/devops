apiVersion: v1
kind: Service
metadata:
  name: nodeapp
  namespace: nodeapp
  labels:
    app: nodeapp
spec:
  type: LoadBalancer      # gives each cluster its own public IP (later: Front Door origin)
  selector:
    app: nodeapp
  ports:
    - name: http
      port: 80
      targetPort: 3000    # must match containerPort in deployment.yaml
