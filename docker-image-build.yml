name: 1.0.$(Rev:r)  # Automatically incrementing build number for each run

trigger:
  - azure-pipelines

parameters:
  - name: deploymentStrategy
    displayName: Deployment strategy
    type: string
    default: rolling          # used for automatic (push-triggered) runs
    values:
      - rolling
      - canary
  - name: canaryPercentage
    displayName: Canary percentage (only used for canary)
    type: number
    default: 25

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'acr-service-connection-indiasouthcentral'
  imageRepository: 'my-web-app'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildNumber)'

  acrLoginServer: 'myacrindiasouthcentral.azurecr.io'
  azureServiceConnection: 'my-resource-manager-connection'

stages:
- stage: BuildAndPushStage
  displayName: 'Build and Push Docker Image'
  jobs:
  - job: BuildAndPushJob
    displayName: 'Build and Push'
    steps:
    - task: Docker@2
      displayName: 'Build and Push Image to Registry'
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: '$(dockerfilePath)'
        tags: |
          $(tag)
          latest

# ======================= ROLLING (default) =======================
- ${{ if eq(parameters.deploymentStrategy, 'rolling') }}:
  - template: templates/deploy-region.yml
    parameters:
      region: indiasouthcentral
      environment: aks-indiasouthcentral
      resourceGroup: 'my-resource-group-India-west'
      clusterName: 'my-cluster-1'
      dependsOn:
        - BuildAndPushStage

  - template: templates/deploy-region.yml
    parameters:
      region: centralindia
      environment: aks-centralindia
      resourceGroup: 'my-resource-group-India-west'
      clusterName: 'my-cluster-2'
      dependsOn:
        - Deploy_indiasouthcentral

# ========================== CANARY ===============================
- ${{ if eq(parameters.deploymentStrategy, 'canary') }}:
  - template: templates/deploy-region-canary.yml
    parameters:
      region: indiasouthcentral
      environment: aks-indiasouthcentral
      resourceGroup: 'my-resource-group-India-west'
      clusterName: 'my-cluster-1'
      canaryPercentage: ${{ parameters.canaryPercentage }}
      notifyUsers: 'omkarkhare60@gmail.com'
      dependsOn:
        - BuildAndPushStage

  - template: templates/deploy-region-canary.yml
    parameters:
      region: centralindia
      environment: aks-centralindia
      resourceGroup: 'my-resource-group-India-west'
      clusterName: 'my-cluster-2'
      canaryPercentage: ${{ parameters.canaryPercentage }}
      notifyUsers: 'omkarkhare60@gmail.com'
      dependsOn:
        - Deploy_indiasouthcentral
